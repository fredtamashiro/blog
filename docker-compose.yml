services: 
  nginx:
    container_name: nginx
    image: nginx:stable-alpine
    ports:
      - '8888:80'
    volumes:
      - ./app:/var/www/fredsite
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network

  php:
    container_name: php
    build:
      context: ./php
    ports:
      - '9000:9000'
    volumes:
      - ./app:/var/www/fredsite
    depends_on:
      - dbmysql
    networks:
      - app-network

  dbmysql:
    container_name: dbmysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fredsite
      MYSQL_USER: fredsite
      MYSQL_PASSWORD: fredsite
    ports:
      - '4306:3306'
    volumes:
      - ./mysql:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16